# Tessera + Victoria stack — local-host dev / verification stack.
#
# Run with:
#   docker compose -f docker-compose.yml up -d
#   curl -sf http://localhost:1990/api/v1/health
#
# Tear down with:
#   docker compose -f docker-compose.yml down -v

# Reasonable safety net so deployment-scoped env vars don't leak into
# tessera when invoked from a shell that has them set unexpectedly.
name: tessera-mvp

services:
  victoria:
    image: victoriametrics/victoria-stack:v1.10.0
    container_name: tessera-victoria
    # Single-binary Victoria stack serves all three roles: vtselect, vlselect,
    # vmselect. In MVP-01 Tessera only consumes traces+logs paths.
    command:
      - "--storageNode=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
    ports:
      # Bind to non-default port range so Victoria doesn't collide with any
      # local standalone install the developer might be running on standard
      # 10428/9428/8429.
      - "1993:8428"
    volumes:
      - victoria-data:/victoria-metrics-data
    healthcheck:
      # Victoria root responds 200/400 to GET /. 200 when configured.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8428/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  tessera:
    build:
      context: .
      dockerfile: docker/Dockerfile
      # Pin buildkit cache-from later if/when we push base image layers to
      # ghcr.io/dot-stbl/tessera-cache.
    container_name: tessera-host
    # Run tessera on host port 1990. Backend listens on :1990 inside
    # the container (matches `docker/Dockerfile` EXPOSE + ASPNETCORE_URLS).
    ports:
      - "1990:1990"
    # depends_on with healthcheck gate — tessera waits until /health on
    # the victoria container returns ok before starting. Avoids the
    # TES-001 "first 30s the host reports upstream errors" race on
    # boot.
    depends_on:
      victoria:
        condition: service_healthy
    environment:
      # TesseraConfigPaths.ResolveMainPath 4-level lookup — `$TESSERA_CONFIG`
      # overrides the default /etc/tessera/tessera.toml path; we point it at
      # the in-container tessera.toml for clarity. Could also be done as a
      # bind mount and let ResolveMainPath find it via default /etc/tessera.
      TESSERA_CONFIG: /etc/tessera/tessera.toml
      # TOML config — inline URI shapes the [server] / [victoria.*] sections
      # of tessera.toml. Plain env-vars overlay wins over file settings per
      # Microsoft.Extensions.Configuration layered overrides.
      TESSERA__SERVER__PORT: "1990"
      TESSERA__VICTORIA__TRACES__URL: "http://victoria:8428"
      TESSERA__VICTORIA__LOGS__URL: "http://victoria:8428"
      TESSERA__VICTORIA__METRICS__URL: "http://victoria:8428"
      # MVP-01: admin token unset is allowed — Host starts cleanly with the
      # admin scheme disabled. Set to a real token here to enable admin
      # endpoints when Phase 5+ adds [Authorize(Policy="admin")] usages.
      TESSERA_ADMIN_TOKEN: "${TESSERA_ADMIN_TOKEN:-}"
    volumes:
      # Mount the committed `tessera.toml.example` as the live config so a
      # first-time `docker compose up` works without any local file. The
      # bind mount is read-only; for env-specific overrides create a
      # `tessera.local.toml` file alongside (mounted as second file) and
      # the chain-loader picks it up automatically.
      - ./src/host/Tessera.Host/tessera.toml.example:/etc/tessera/tessera.toml:ro
    healthcheck:
      # Use the public composite-health endpoint that already exists.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:1990/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  victoria-data:
    # Shared between `docker compose down -v` (prune) and `up` (re-attach).
    name: tessera-victoria-data
