# Default host config (committed) — vironima.internal stack (always-on home lab).
# Machine overrides: tessera.local.toml (gitignored) next to this file.
#
# Ingress hosts from vironima.internal README / ops docs:
#   vtraces / vlogs / vmui .vironima.internal  →  VT :10428, VL :9428, vmsingle :8428
# Requires DNS (or hosts) for *.vironima.internal and network reachability to the lab.

[server]
host = "127.0.0.1"
port = 1990

[victoria]
tenant = "0"
timeout_ms = 15000

[victoria.traces]
# Base for Refit paths /select/{tenant}/jaeger/api/...
url = "https://vtraces.vironima.internal"

[victoria.logs]
# Base for /select/{tenant}/logsql/query
url = "https://vlogs.vironima.internal"

[victoria.metrics]
# vmsingle Prometheus API (vmui ingress) — /api/v1/query (no cluster select prefix)
url = "https://vmui.vironima.internal"

[storage]
provider = "sqlite"

[telemetry]
service_name = "tessera"
# Optional local collector; export failures are non-fatal if nothing listens.
otlp_endpoint = "http://127.0.0.1:4317"
enable_console_exporter = false
enable_asp_net_core_instrumentation = true
enable_http_client_instrumentation = true
trace_sampling_ratio = 1.0
