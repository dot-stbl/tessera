# Tessera configuration for the compose stack.
#
# Bound into the tessera container as /etc/tessera.conf/tessera.toml by
# compose/docker-compose.yml. URLs use service names so they resolve
# inside the compose network without any port mapping knowledge.
#
# Production deploys swap this file for the host-local tessera.toml —
# the shape (sections, keys, types) is identical; only the URLs change.

[server]
host = "0.0.0.0"
port = 1990

[victoria]
tenant = "0"
timeout_ms = 5000

[victoria.traces]
url = "http://victoria-traces:10428"
token = ""

[victoria.logs]
url = "http://victoria-logs:9428"
token = ""

[victoria.metrics]
url = "http://victoria-metrics:8428"
token = ""

[auth]
# Leave admin_token_source unset to disable the admin scheme. Set
# TESSERA_ADMIN_TOKEN at deploy time to enable; the admin-auth handler
# returns NoResult() for unauthenticated requests, so /api/v1/admin/*
# surfaces 401 cleanly.

[telemetry]
service_name = "tessera"
log_level = "info"
metrics_endpoint = "/metrics"

# File-based data root — see compose/README.md "Storage layout" for the
# canonical directory tree under TESSERA_DATA_ROOT.
data_root = "/var/lib/tessera"
