# Grafana dashboard provider.
#
# The dev-shipped dashboards live in /etc/grafana/provisioning/dashboards/
# which is the path Grafana watches for *.json. We ship an empty file
# (no built-in dashboards in MVP-01) — add per-feature dashboards here
# as JSON, or import via Grafana UI and export with the
# provisioning= section flag.
#
# To enable dashboard discovery once a JSON is dropped in, restart the
# `tessera.grafana` container; the `reload_provisioning` built-in API
# also picks up new files without restart.

apiVersion: 1

providers:
  - name: tessera-dashboards
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
