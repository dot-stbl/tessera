name: release

# Tessera container publish workflow.
#
# Triggers:
#   - push of a tag matching 'v*' (e.g. v0.1.0)
#   - workflow_dispatch (manual run from the Actions tab)
#
# What it does:
#   Builds the Tessera.Host runtime image (compose/Dockerfile) and
#   pushes it to ghcr.io/dot-stbl/tessera with the tag as the image
#   tag plus 'latest' on the most recent push. Uses docker buildx with
#   GitHub Actions cache backend so successive runs reuse layers.
#
# Auth: the default GITHUB_TOKEN works for ghcr.io on a public repo
# without extra configuration. For a private repo, the token needs
# the 'packages: write' permission (set below) and org membership
# allowing container publish.
#
# Image variant:
#   Build context = repository root so the Dockerfile can COPY
#   Directory.Build.props / src/ / global.json (the Dockerfile is at
#   compose/Dockerfile). Same build path the developer runs locally
#   with `docker build -f compose/Dockerfile .`.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (e.g. v0.1.0-rc1). Empty = use 'latest'.
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

concurrency:
  # Releases for the same tag don't overlap (e.g. a re-run on v0.1.0
  # cancels the previous v0.1.0 build). Manual dispatches get their
  # own slot.
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  container:
    name: build + push container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to ghcr.io
        # The default GITHUB_TOKEN is sufficient for ghcr.io on a
        # public repo. For private repos, the workflow's
        # 'packages: write' permission above is enough -- no PAT
        # needed.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.18.0

      - name: Extract image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag || latest }}" >> "$GITHUB_OUTPUT"
          else
            # 'refs/tags/v0.1.0' -> 'v0.1.0'
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compose/Dockerfile
          push: true
          tags: |
            ghcr.io/dot-stbl/tessera:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.tag == 'latest' && '' || 'ghcr.io/dot-stbl/tessera:latest' }}
          labels: |
            org.opencontainers.image.title=Tessera
            org.opencontainers.image.description=Self-hosted APM UI for the Victoria stack
            org.opencontainers.image.source=https://github.com/dot-stbl/tessera
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
