<?xml version="1.0" encoding="UTF-8"?>
<!--
  mark-tessera-transparent.svg — 4-tile scatter, TRANSPARENT background.
  Use on colored/dark surfaces where mark-tessera.svg's white bg would clash.

  Redrawn 2026-07-21 (3 black + 1 red). Theme via prefers-color-scheme:
    Light: tiles #000,   accent #A60000
    Dark:  tiles #fff,   accent #E0483F (lighter red for contrast)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Tessera">
  <title>Tessera</title>
  <style>
    .tile { fill: #000; }
    .accent { fill: #A60000; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #fff; }
      .accent { fill: #E0483F; }
    }
  </style>
  <rect class="tile"   x="22" y="8"  width="16" height="16"/>
  <rect class="tile"   x="52" y="34" width="16" height="16"/>
  <rect class="tile"   x="12" y="56" width="16" height="16"/>
  <rect class="accent" x="31" y="56" width="16" height="16"/>
</svg>
