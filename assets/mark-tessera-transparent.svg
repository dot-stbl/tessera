<?xml version="1.0" encoding="UTF-8"?>
<!--
  mark-tessera-transparent.svg — same 5-tile scatter, but TRANSPARENT background.

  Use this when placing the mark on a colored surface (dark themes,
  branded backgrounds, etc.) where the white rectangle in mark-tessera.svg
  would clash.

  Theme support via @media (prefers-color-scheme: dark):
    - Light: tiles dark (#1a1a1a), accent deep red (#a8201c)
    - Dark:  tiles white (#ffffff), accent lighter red (#d94540)

  Hex approximations of OKLCH tokens from .agents/docs/ui/design-system.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Tessera">
  <title>Tessera</title>
  <style>
    .tile { fill: #1a1a1a; }
    .accent { fill: #a8201c; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #ffffff; }
      .accent { fill: #d94540; }
    }
  </style>
  <rect class="tile"   x="8"  y="8"  width="16" height="16" rx="2"/>
  <rect class="tile"   x="32" y="8"  width="16" height="16" rx="2"/>
  <rect class="tile"   x="56" y="32" width="16" height="16" rx="2"/>
  <rect class="tile"   x="20" y="56" width="16" height="16" rx="2"/>
  <rect class="accent" x="44" y="56" width="16" height="16" rx="2"/>
</svg>